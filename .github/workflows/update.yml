name: Update ARAM CN data

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-aram-cn-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch 101 data
        run: node scripts/fetch-101.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/manifest.json
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "data: update $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
